<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFCレビューカード ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{
    --bg:#05070f;
    --surface:rgba(20,26,46,0.55);
    --surface-2:rgba(255,255,255,0.05);
    --surface-solid:#101527;
    --line:rgba(130,170,255,0.16);
    --line-strong:rgba(130,170,255,0.4);
    --text:#eaf1ff;
    --muted:#7c88a8;
    --accent:#4da3ff;
    --accent-2:#8b5cf6;
    --good:#2ee6b8;
    --bad:#ff5c7a;
    --amber:#ffb454;
  }
  *{box-sizing:border-box;}
  html{ background:var(--bg); }
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Sora','Hiragino Kaku Gothic ProN','Noto Sans JP',-apple-system,sans-serif;
    position:relative;
    overflow-x:hidden;
  }
  body::before, body::after{
    content:'';
    position:fixed;
    width:640px; height:640px;
    border-radius:50%;
    filter:blur(120px);
    z-index:-1;
    opacity:0.35;
    pointer-events:none;
  }
  body::before{ top:-220px; left:-160px; background:radial-gradient(circle, var(--accent), transparent 70%); }
  body::after{ bottom:-260px; right:-180px; background:radial-gradient(circle, var(--accent-2), transparent 70%); }

  .top{
    padding:22px 28px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(8,11,22,0.55);
    backdrop-filter:blur(14px);
    position:sticky; top:0; z-index:10;
  }
  .top h1{
    font-size:19px; margin:0; letter-spacing:0.02em; font-weight:700;
    background:linear-gradient(120deg, #ffffff 10%, var(--accent) 55%, var(--accent-2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .top span{ color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .layout{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:0;
    min-height:calc(100vh - 66px);
  }
  .sidebar{
    border-right:1px solid var(--line);
    padding:22px 20px;
    background:rgba(10,13,26,0.35);
  }
  .sidebar h2{ font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin:0 0 14px; font-weight:600; }
  .form-field{ margin-bottom:12px; }
  .form-field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  .form-field input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:9px;
    padding:9px 11px;
    font-size:13px;
    font-family:inherit;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .form-field input:focus{
    outline:none;
    border-color:var(--line-strong);
    box-shadow:0 0 0 3px rgba(77,163,255,0.15);
  }
  .btn{
    width:100%;
    padding:11px 0;
    border-radius:9px;
    border:none;
    background:linear-gradient(120deg, var(--accent), var(--accent-2));
    color:#fff;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.02em;
    cursor:pointer;
    margin-top:8px;
    box-shadow:0 0 0 rgba(77,163,255,0);
    transition:box-shadow .2s ease, transform .1s ease;
  }
  .btn:hover{ box-shadow:0 4px 24px rgba(77,163,255,0.45); }
  .btn:active{ transform:scale(0.98); }
  .store-list{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .store-item{
    padding:11px 13px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface-2);
    cursor:pointer;
    font-size:13px;
    transition:border-color .15s ease, background .15s ease;
  }
  .store-item:hover{ border-color:var(--line-strong); }
  .store-item.active{
    background:linear-gradient(120deg, rgba(77,163,255,0.16), rgba(139,92,246,0.12));
    border-color:var(--accent);
    box-shadow:0 0 20px rgba(77,163,255,0.15);
  }
  .store-item .name{ font-weight:600; margin-bottom:2px; }
  .store-item .code{ color:var(--muted); font-size:11px; font-family:monospace; }

  .main{ padding:26px 30px; }
  .empty-state{ color:var(--muted); font-size:14px; margin-top:40px; text-align:center; }

  .card-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
  .stat-card{
    background:var(--surface);
    backdrop-filter:blur(16px);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 20px;
  }
  .stat-card .label{ font-size:12px; color:var(--muted); margin-bottom:8px; letter-spacing:0.02em; }
  .stat-card .value{
    font-size:28px; font-weight:700; font-variant-numeric:tabular-nums;
    background:linear-gradient(120deg, #ffffff, var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .stat-card .delta{ font-size:12.5px; margin-top:6px; }
  .delta.up{ color:var(--good); }
  .delta.down{ color:var(--bad); }
  .delta.flat{ color:var(--muted); }

  .panel{
    background:var(--surface);
    backdrop-filter:blur(16px);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 22px;
    margin-bottom:20px;
  }
  .panel h3{ margin:0 0 14px; font-size:13.5px; color:var(--muted); font-weight:600; letter-spacing:0.02em; }
  .redirect-box{
    display:flex;
    gap:8px;
    align-items:center;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 13px;
    font-family:monospace;
    font-size:12.5px;
    word-break:break-all;
  }
  .redirect-box button{
    flex-shrink:0;
    background:var(--surface-solid);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:7px;
    padding:6px 11px;
    font-size:11.5px;
    font-family:inherit;
    cursor:pointer;
  }
  canvas{ max-height:260px; }

  @media (max-width: 760px){
    .top{ padding:16px; flex-direction:column; align-items:flex-start; gap:4px; }
    .top h1{ font-size:16px; }
    .layout{ display:block; min-height:auto; }
    .sidebar{ border-right:none; border-bottom:1px solid var(--line); padding:16px; }
    .main{ padding:16px; }
    .card-row{ grid-template-columns:1fr; gap:10px; }
    .stat-card .value{ font-size:22px; }
    .panel{ padding:14px 16px; }
    canvas{ max-height:220px; }
    .redirect-box{ flex-direction:column; align-items:stretch; }
    .redirect-box button{ width:100%; padding:8px 0; }
    .store-list{ flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:4px; }
    .store-item{ flex:0 0 auto; min-width:140px; }
  }
</style>
</head>
<body>
  <div class="top">
    <h1>NFCレビューカード ダッシュボード</h1>
    <span id="clock"></span>
  </div>

  <div class="layout">
    <div class="sidebar">
      <h2>カードを新規登録</h2>
      <div class="form-field">
        <label>店舗名</label>
        <input id="f-name" placeholder="例: 〇〇カフェ 本店">
      </div>
      <div class="form-field">
        <label>飛ばし先URL(Googleレビュー投稿URL)</label>
        <input id="f-target" placeholder="https://search.google.com/local/writereview?placeid=...">
      </div>
      <div class="form-field" id="placeIdPreview" style="display:none;">
        <label>Place ID(URLから自動検出)</label>
        <input id="f-place" readonly style="opacity:0.75;">
      </div>
      <button class="btn" id="addBtn">カードを作成</button>

      <label style="display:flex; align-items:center; gap:8px; margin-top:20px; font-size:12.5px; color:var(--muted); cursor:pointer; user-select:none;">
        <input type="checkbox" id="anonToggle" style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer;">
        店舗名を隠す(A店・B店…表示)
      </label>

      <div class="store-list" id="storeList"></div>
    </div>


    <div class="main" id="main">
      <div class="empty-state">左のフォームから店舗を登録するか、リストから選択してください。</div>
    </div>
  </div>

<script>
  const API = '';
  let stores = [];
  let activeId = null;
  let anonymize = false;
  let clickChart = null;
  let reviewChart = null;
  let reviewWeeklyChart = null;
  let cvrChart = null;

  function fmtDelta(count, percent){
    if(count === null || count === undefined) return '<span class="delta flat">比較データ不足</span>';
    const cls = count > 0 ? 'up' : count < 0 ? 'down' : 'flat';
    const sign = count > 0 ? '+' : '';
    const pct = percent === null ? '' : `(${sign}${percent}%)`;
    return `<span class="delta ${cls}">${sign}${count} 先週比 ${pct}</span>`;
  }

  async function loadStores(){
    const res = await fetch(`${API}/api/stores`);
    stores = await res.json();
    renderStoreList();
    if(!activeId && stores.length){ selectStore(stores[0].id); }
  }

  function letterLabel(index){
    // 0->A, 1->B, ... 25->Z, 26->AA, 27->AB ...
    let n = index, label = '';
    do {
      label = String.fromCharCode(65 + (n % 26)) + label;
      n = Math.floor(n / 26) - 1;
    } while (n >= 0);
    return label + '店';
  }

  function renderStoreList(){
    const list = document.getElementById('storeList');
    list.innerHTML = stores.map((s,i) => `
      <div class="store-item ${s.id===activeId?'active':''}" data-id="${s.id}">
        <div class="name">${anonymize ? letterLabel(i) : escapeHtml(s.name)}</div>
        <div class="code">/r/${s.code}</div>
      </div>
    `).join('');
    [...list.querySelectorAll('.store-item')].forEach(el=>{
      el.addEventListener('click', ()=> selectStore(el.dataset.id));
    });
  }

  document.getElementById('anonToggle').addEventListener('change', (e)=>{
    anonymize = e.target.checked;
    renderStoreList();
  });

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  async function selectStore(id){
    activeId = id;
    renderStoreList();
    const store = stores.find(s=>s.id===id);

    // データが届くまでの間、切り替えたことがすぐ分かるようにする(体感速度の改善)
    document.getElementById('main').innerHTML = '<div class="empty-state">読み込み中…</div>';

    const res = await fetch(`${API}/api/stores/${id}/dashboard`);
    const { stats, reviews } = await res.json();
    renderMain(store, stats, reviews);
  }

  function renderMain(store, stats, reviews){
    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="card-row">
        <div class="stat-card">
          <div class="label">今週のタップ数</div>
          <div class="value">${stats.thisWeek}</div>
          <div>${fmtDelta(stats.deltaCount, stats.deltaPercent)}</div>
        </div>
        <div class="stat-card">
          <div class="label">先週のタップ数</div>
          <div class="value">${stats.lastWeek}</div>
        </div>
        <div class="stat-card">
          <div class="label">Googleレビュー数(最新)</div>
          <div class="value">${reviews.snapshots.length ? reviews.snapshots[reviews.snapshots.length-1].reviewCount : '—'}</div>
          <div>${reviews.hasPlaceId ? fmtDelta(reviews.deltaCount, null) : '<span class="delta flat">Place ID未設定</span>'}</div>
        </div>
      </div>

      <div class="panel">
        <h3>このカードのタップ用URL(NFCに書き込むURL)</h3>
        <div class="redirect-box">
          <span id="redirectUrl">${store.redirectUrl}</span>
          <button id="copyBtn">コピー</button>
        </div>
        <button id="deleteBtn" style="margin-top:12px;width:100%;padding:9px 0;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--bad);font-size:12.5px;cursor:pointer;">この店舗を削除する</button>
      </div>

      <div class="panel">
        <h3>日別タップ数(過去30日)</h3>
        <canvas id="clickChart"></canvas>
      </div>

      <div class="panel">
        <h3>Googleレビュー数の推移</h3>
        ${reviews.snapshots.length ? '<canvas id="reviewChart"></canvas>' :
          '<div class="empty-state" style="margin-top:0;">Place IDを設定し、scripts/snapshot-reviews.js を毎日実行するとここに推移が表示されます。</div>'}
      </div>

      <div class="panel">
        <h3>Googleレビュー数 週別(直近8週間)</h3>
        ${reviews.snapshots.length ? '<canvas id="reviewWeeklyChart"></canvas>' :
          '<div class="empty-state" style="margin-top:0;">記録が貯まるとここに週ごとの件数と増加数が表示されます。</div>'}
      </div>

      <div class="panel">
        <h3>タップ→レビュー転換率(CVR・直近8週間)</h3>
        ${reviews.snapshots.length ? '<canvas id="cvrChart"></canvas>' :
          '<div class="empty-state" style="margin-top:0;">レビュー数の記録が貯まるとここにCVRが表示されます。</div>'}
      </div>
    `;

    document.getElementById('copyBtn').addEventListener('click', ()=>{
      navigator.clipboard.writeText(store.redirectUrl);
      document.getElementById('copyBtn').textContent = 'コピーしました';
      setTimeout(()=> document.getElementById('copyBtn').textContent = 'コピー', 1500);
    });

    const deleteBtn = document.getElementById('deleteBtn');
    deleteBtn.addEventListener('click', async ()=>{
      if(deleteBtn.dataset.armed === '1'){
        const res = await fetch(`${API}/api/stores/${store.id}`, { method:'DELETE' });
        if(!res.ok){ alert('削除に失敗しました'); return; }
        activeId = null;
        await loadStores();
        if(stores.length){ selectStore(stores[0].id); }
        else {
          document.getElementById('main').innerHTML = '<div class="empty-state">左のフォームから店舗を登録するか、リストから選択してください。</div>';
          renderStoreList();
        }
      } else {
        deleteBtn.dataset.armed = '1';
        deleteBtn.textContent = 'もう一度押すと完全に削除します';
        setTimeout(()=>{
          deleteBtn.dataset.armed = '0';
          deleteBtn.textContent = 'この店舗を削除する';
        }, 3000);
      }
    });

    if(clickChart) clickChart.destroy();
    clickChart = new Chart(document.getElementById('clickChart'), {
      type: 'bar',
      data: {
        labels: stats.daily.map(d => d.date.slice(5)),
        datasets: [{
          label: 'タップ数',
          data: stats.daily.map(d => d.count),
          backgroundColor: '#4da3ff'
        }]
      },
      options: {
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        plugins:{ legend:{ display:false } },
        scales:{
          x:{ grid:{ color:'rgba(130,170,255,0.12)' }, ticks:{ color:'#7c88a8', maxRotation:0, autoSkip:true, maxTicksLimit:10 } },
          y:{ grid:{ color:'rgba(130,170,255,0.12)' }, ticks:{ color:'#7c88a8', precision:0 } }
        }
      }
    });

    if(reviews.snapshots.length){
      if(reviewChart) reviewChart.destroy();
      reviewChart = new Chart(document.getElementById('reviewChart'), {
        type: 'line',
        data: {
          labels: reviews.snapshots.map(s => s.date.slice(5)),
          datasets: [{
            label: 'レビュー数',
            data: reviews.snapshots.map(s => s.reviewCount),
            borderColor: '#2ee6b8',
            backgroundColor: 'rgba(46,230,184,0.15)',
            fill: true,
            tension: 0.3,
            pointRadius: 4,
            pointHitRadius: 30,
            pointHoverRadius: 6
          }]
        },
        options: {
          interaction: { mode: 'index', intersect: false },
          plugins:{ legend:{ display:false } },
          scales:{
            x:{ grid:{ color:'rgba(130,170,255,0.12)' }, ticks:{ color:'#7c88a8' } },
            y:{ grid:{ color:'rgba(130,170,255,0.12)' }, ticks:{ color:'#7c88a8', precision:0 } }
          }
        }
      });

      if(reviewWeeklyChart) reviewWeeklyChart.destroy();
      reviewWeeklyChart = new Chart(document.getElementById('reviewWeeklyChart'), {
        type: 'bar',
        data: {
          labels: reviews.weekly.map(w => `${w.label}\n(〜${w.end.slice(5)})`),
          datasets: [{
            label: '増加数',
            data: reviews.weekly.map(w => w.delta),
            backgroundColor: reviews.weekly.map((w,i) => i === reviews.weekly.length-1 ? '#2ee6b8' : 'rgba(46,230,184,0.18)')
          }]
        },
        options: {
          interaction: { mode: 'nearest', axis: 'x', intersect: false },
          plugins:{
            legend:{ display:false },
            tooltip:{
              callbacks:{
                label: (ctx) => {
                  const w = reviews.weekly[ctx.dataIndex];
                  if(w.delta === null) return 'データなし';
                  return w.delta > 0 ? `+${w.delta}件(累計${w.reviewCount}件)` : `${w.delta}件(累計${w.reviewCount}件)`;
                }
              }
            }
          },
          scales:{
            x:{ grid:{ color:'rgba(130,170,255,0.12)' }, ticks:{ color:'#7c88a8' } },
            y:{ grid:{ color:'rgba(130,170,255,0.12)' }, ticks:{ color:'#7c88a8', precision:0 } }
          }
        }
      });

      const cvrData = reviews.weekly.map((w, i) => {
        const taps = (stats.weeklyTaps && stats.weeklyTaps[i]) ? stats.weeklyTaps[i].count : null;
        if (w.delta === null || taps === null || taps === 0) return null;
        return Math.round((w.delta / taps) * 1000) / 10; // 小数点1桁
      });

      if(cvrChart) cvrChart.destroy();
      cvrChart = new Chart(document.getElementById('cvrChart'), {
        type: 'bar',
        data: {
          labels: reviews.weekly.map(w => `${w.label}\n(〜${w.end.slice(5)})`),
          datasets: [{
            label: 'CVR',
            data: cvrData,
            backgroundColor: cvrData.map((v,i) => i === cvrData.length-1 ? '#ffb454' : 'rgba(255,180,84,0.18)')
          }]
        },
        options: {
          interaction: { mode: 'nearest', axis: 'x', intersect: false },
          plugins:{
            legend:{ display:false },
            tooltip:{
              callbacks:{
                label: (ctx) => {
                  const i = ctx.dataIndex;
                  const w = reviews.weekly[i];
                  const taps = (stats.weeklyTaps && stats.weeklyTaps[i]) ? stats.weeklyTaps[i].count : null;
                  if(cvrData[i] === null) return 'データ不足';
                  return `タップ${taps}回 → レビュー増加${w.delta}件(CVR ${cvrData[i]}%)`;
                }
              }
            }
          },
          scales:{
            x:{ grid:{ color:'rgba(130,170,255,0.12)' }, ticks:{ color:'#7c88a8' } },
            y:{ grid:{ color:'rgba(130,170,255,0.12)' }, ticks:{ color:'#7c88a8', callback:(v)=> v + '%' } }
          }
        }
      });
    }
  }

  document.getElementById('f-target').addEventListener('input', (e)=>{
    const preview = document.getElementById('placeIdPreview');
    const placeInput = document.getElementById('f-place');
    const extracted = extractPlaceIdClient(e.target.value.trim());
    if(extracted){
      placeInput.value = extracted;
      preview.style.display = 'block';
    } else {
      preview.style.display = 'none';
      placeInput.value = '';
    }
  });

  function extractPlaceIdClient(url){
    if(!url) return null;
    try{
      const u = new URL(url);
      const q = u.searchParams.get('placeid') || u.searchParams.get('place_id');
      if(q) return q;
    } catch(e){ /* 不正なURLはスキップ */ }
    const m = url.match(/ChIJ[a-zA-Z0-9_-]+/);
    return m ? m[0] : null;
  }

  document.getElementById('addBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('f-name').value.trim();
    const targetUrl = document.getElementById('f-target').value.trim();
    const placeId = document.getElementById('f-place').value.trim();
    if(!name || !targetUrl){ alert('店舗名とURLは必須です'); return; }

    const res = await fetch(`${API}/api/stores`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, targetUrl, placeId: placeId || undefined })
    });
    if(!res.ok){ alert('作成に失敗しました'); return; }
    const store = await res.json();
    document.getElementById('f-name').value='';
    document.getElementById('f-target').value='';
    document.getElementById('f-place').value='';
    await loadStores();
    selectStore(store.id);
  });

  function tickClock(){
    document.getElementById('clock').textContent = new Date().toLocaleString('ja-JP');
  }
  setInterval(tickClock, 1000);
  tickClock();

  loadStores();
</script>
</body>
</html>
